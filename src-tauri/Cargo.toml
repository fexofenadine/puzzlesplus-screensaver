[package]
name = "puzzlesplus-screensaver"
version = "2.0.0"
description = "Puzzles Plus's animated themes as a Windows screensaver"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
#custom-protocol serves the built pages from inside the program, never from a dev server
tauri = { version = "2", features = ["custom-protocol"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
